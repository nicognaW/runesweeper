<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Runesweeper</title>
<link rel="icon" href="icon.png">
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; touch-action: none; background: #07080f; }
  #status { position: fixed; inset: 0; display: grid; place-items: center; font: 500 15px/1.5 system-ui, sans-serif; color: #8a93ad; text-align: center; padding: 24px; }
  #status a { color: #6aa8ff; }
</style>
<div id="status">Loading Runesweeper…</div>
<script type="module">
import init from './app.js';
const status = document.querySelector('#status');
try {
  if (!navigator.gpu) throw new Error('nogpu');
  await init();
  status.remove();
} catch (error) {
  console.error(error);
  status.innerHTML = String(error).includes('nogpu')
    ? 'Runesweeper needs WebGPU: a recent Chrome, Edge or Safari 26+.<br>Or <a href="https://github.com/nicognaW/runesweeper/releases">download the desktop app</a>.'
    : 'Could not start: ' + String(error) + '<br><a href="?plain">Try without effects</a>';
}
</script>
</html>
