[package]
name = "runesweeper"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Minesweeper, faithfully, on Rune's GPU renderer."
repository = "https://github.com/nicognaW/runesweeper"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "runesweeper"
path = "src/main.rs"

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "781e2b6d87cd5f32d6f4365956fad4baaf24ee50" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "781e2b6d87cd5f32d6f4365956fad4baaf24ee50" }
rune-fx = { git = "https://github.com/anomalyco/rune", rev = "781e2b6d87cd5f32d6f4365956fad4baaf24ee50" }
rune-motion = { git = "https://github.com/anomalyco/rune", rev = "781e2b6d87cd5f32d6f4365956fad4baaf24ee50" }
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "metal", "wgsl"] }

[target.'cfg(all(not(target_os = "macos"), not(target_arch = "wasm32")))'.dependencies]
wgpu = { version = "30", default-features = false, features = ["vulkan", "dx12"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Storage", "Location", "Navigator", "Worker", "WorkerOptions", "WorkerType", "MessageEvent"] }
js-sys = "0.3"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
codegen-units = 16
incremental = true
strip = "debuginfo"

[profile.dist]
inherits = "release"
codegen-units = 1
lto = "thin"
incremental = false

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# rune-fx with a one-line wasm fix (see vendor/rune-fx/Cargo.toml).
[patch."https://github.com/anomalyco/rune"]
rune-fx = { path = "vendor/rune-fx" }
